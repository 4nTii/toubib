services:

  toubib:
    build:
      target: dev
    container_name: toubib_front_dev
    restart: "no"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - path: .env
        required: false
      - path: .env.dev
        required: false
    environment:
      - CHOKIDAR_USEPOLLING=true
